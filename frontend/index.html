<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar bg-dark" data-bs-theme="dark">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Expense Tracker</span>

        <div class="d-flex gap-3 align-items-center">
          <input
            type="text"
            id="searchTitle"
            class="form-control"
            placeholder="Find your expense"
          />

          <div class="form-check form-switch d-flex align-items-center gap-2">
            <input
              class="form-check-input"
              type="checkbox"
              id="darkModeSwitch"
            />

            <label
              class="form-check-label text-light text-nowrap"
              for="darkModeSwitch"
            >
              Dark Mode
            </label>
          </div>
        </div>
      </div>
    </nav>
    <div class="container mt-4">
      <!-- Summary Cards -->
      <!-- Summary Cards -->
      <div class="summary-grid mb-4">
        <!-- Total Amount -->
        <div>
          <div class="card">
            <div class="card-body">
              <h5>Total Amount</h5>
              <p id="totalAmount">0</p>
            </div>
          </div>
        </div>

        <!-- Number of Expenses -->
        <div>
          <div class="card">
            <div class="card-body">
              <h5>Number of Expenses</h5>
              <p id="expenseCount">0</p>
            </div>
          </div>
        </div>

        <!-- Highest Expense -->
        <div>
          <div class="card">
            <div class="card-body">
              <h5>Highest Expense</h5>
              <p id="highestExpense">0</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Add Expense Form -->
      <div class="card mb-4">
        <div class="card-body">
          <h4 class="mb-3">Add Expense</h4>

          <div id="alertContainer"></div>
          <div id="loadingSpinner" class="text-center my-3 d-none">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <form id="expenseForm">
            <!-- Title -->
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" id="title" class="form-control" />
            </div>

            <!-- Amount -->
            <div class="mb-3">
              <label for="amount" class="form-label">Amount</label>
              <input
                type="number"
                id="amount"
                class="form-control"
                min="0.01"
                step="0.01"
                required
              />
            </div>

            <!-- Category -->
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>

              <select id="category" class="form-select" required>
                <option value="">Choose Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Date -->
            <div class="mb-3">
              <label for="date" class="form-label">Date</label>
              <input type="date" id="date" class="form-control" required />
            </div>

            <button type="submit" class="btn btn-primary">Add Expense</button>
          </form>
        </div>
      </div>

      <!-- Category Filter -->
      <div class="mb-3">
        <label for="filterCategory" class="form-label">
          Filter by Category
        </label>

        <select id="filterCategory" class="form-select">
          <option value="All">All</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <!-- Expenses Table -->
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>

          <!-- Js -->
          <tbody id="expensesTableBody"></tbody>
        </table>

        <!-- Edit Modal -->
        <div class="modal fade" id="editModal" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Edit Expense</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                ></button>
              </div>

              <div class="modal-body">
                <input type="text" id="editTitle" class="form-control mb-3" />

                <input
                  type="number"
                  id="editAmount"
                  class="form-control mb-3"
                  min="0.01"
                  step="0.01"
                  required
                />

                <select id="editCategory" class="form-select mb-3">
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>

                <input type="date" id="editDate" class="form-control" />
              </div>

              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancel
                </button>

                <button
                  type="button"
                  class="btn btn-primary"
                  id="saveEditButton"
                >
                  Save Changes
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
